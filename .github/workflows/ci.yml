name: CI

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Byte-compile all Python
        run: python -m py_compile server.py gui.py native.py patches.py tools.py tests/test_engines.py

      - name: Engine unit tests (pure stdlib, no external tools)
        run: python tests/test_engines.py

      - name: Full import via uv (resolves PEP 723 inline deps)
        run: uv run --script server.py cli projects

      - name: Inline UI JS parses
        run: |
          node -e "const fs=require('fs');const h=fs.readFileSync('ui.html','utf8');const m=h.match(/<script>([\s\S]*)<\/script>\s*<\/body>/);new Function(m[1]);console.log('ui.html inline JS OK')"
